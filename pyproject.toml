[project]
name = "velozatech-pipeline"
version = "0.1.0"
description = "Part opportunity vetting pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "openpyxl>=3.1",
]

[project.scripts]
pipeline = "pipeline.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
